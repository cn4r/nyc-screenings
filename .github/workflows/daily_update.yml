name: Update NYC Movie Ledger

on:
  schedule:
    # 4:00 AM UTC is 11:00 PM EST (New York)
    - cron: '0 4 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 icalendar selenium

      - name: Run Scraper
        run: python scraper.py

      - name: Build Website
        run: python build_website.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Update screenings for $(date)" || echo "No changes"
          git push
